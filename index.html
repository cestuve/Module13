#main{height:100%;position:relative}.intro-panel{max-width:920px}.scene{position:absolute;inset:0}.environment{position:absolute;inset:0;background-size:cover;background-position:center}.scene-guide{top:75px}.m13-hotspot{position:absolute;z-index:15;cursor:pointer;border:4px solid #f5cf7d;background:rgba(255,250,230,.14);border-radius:16px;box-shadow:0 0 0 3px rgba(255,255,255,.6);animation:pulse 1.5s infinite alternate}.m13-person{position:absolute;z-index:6;bottom:0;left:50%;transform:translateX(-50%);height:78%;object-fit:contain;pointer-events:none}.m13-modal-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.m13-content p{font-size:17px;line-height:1.58;color:#405769}.m13-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.m13-card{border:2px solid #d9c9af;border-radius:17px;padding:15px;background:#fff8ec}.m13-card h3{font-size:17px;margin:0 0 7px}.m13-card p{margin:0;font-size:14px}.m13-head{display:flex;gap:15px;align-items:start}.m13-head img{width:72px;height:84px;object-fit:cover;object-position:center 20%;border:2px solid #d6dfe1;border-radius:14px}.m13-head h2{margin:0}.m13-scenario{border:2px solid #e1d5c4;border-radius:18px;background:#fffaf1;padding:16px}.m13-scenario p{margin:0 0 10px}.m13-question{font-weight:800;color:#243746!important}.m13-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.m13-option{cursor:pointer;border:2px solid #d2c5b0;border-radius:14px;background:#f7eada;padding:14px;font:inherit;text-align:left;font-weight:700;color:#243746}.m13-option:focus-visible{outline:3px solid #275efe}.m13-option.wrong{background:#ffe7e4;border-color:#b4544c}.m13-option.correct{background:#e2f2e7;border-color:#477a64}.m13-feedback{margin-top:12px;border-left:6px solid #668d95;background:#edf5f5;border-radius:9px;padding:12px 15px;color:#263b48}.m13-feedback.error{border-left-color:#bb6960;background:#fff1ed}.m13-feedback:empty{display:none}.m13-progress{font-size:13px;font-weight:800;color:#527285}.menu{max-height:77vh;overflow-y:auto}.menu-item{position:relative}.menu-item .menu-heading{display:block;font-size:14px;font-weight:900}.menu-item .menu-subheading{display:block;font-size:12px;font-weight:700;margin-top:4px}.m13-pill{display:inline-block;border-radius:30px;background:#f0dfc2;padding:7px 12px;font-size:12px;font-weight:900;margin:10px 0}.m13-resource{border-radius:15px;padding:16px;border:2px solid #c6d3cf;background:#eef5f4}.m13-resource a{font-weight:900}.m13-narrow{max-width:760px}.m13-scene-btn{position:absolute;z-index:10;bottom:6%;left:50%;transform:translateX(-50%)}

</style></head><body><div class="app"><main id="main"></main><div class="hud"><button id="menuToggle" class="menu-toggle" aria-controls="sectionMenu" aria-expanded="false">Menu ▾</button><nav id="sectionMenu" aria-label="Module 13 sections" class="menu hidden"></nav></div></div><div id="modalBackdrop" class="modal-backdrop hidden"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><button id="closeModal" type="button" class="close-btn" aria-label="Close dialog">×</button><div class="m13-content" id="modalContent"></div></section></div>
<script>
(()=>{'use strict';
const root='https://cestuve.github.io/';
const IMG={outside:root+'module1/BG-01.png',office:root+'module2/Maria_Office.png',group:root+'module9/Staff_Training_Room.png',training:root+'module9/Community_Meeting_Room.png',maria:root+'Module13/Maria_Fullbody.png',mariaHead:root+'Module12/Maria_Headshot.png',daniel:root+'Module13/Daniel_Fullbody.png',danielHead:root+'Module12/Daniel_Headshot.png',jamal:root+'Module12/Jamal_Headshot.png',tanya:root+'Module12/Tanya_Headshot.png',krishna:root+'Module12/Krishna_Headshot.png'};
const topics=[['Welcome to Module 13','Return to Harbor Point'],['Roles Within a Group','How members contribute'],['Group Membership and Preparation','Fixed and revolving groups'],['How Groups Develop','Beginning, middle, and ending'],['Stages of Treatment','Changing needs in recovery'],['Facilitating Group Dynamics','Leadership and interventions'],['Responding to Challenges','Conflict, safety, and subgroups'],['Group Therapy in Practice','Apply learning and reflect']];
const main=document.getElementById('main'),nav=document.getElementById('sectionMenu'),overlay=document.getElementById('modalBackdrop'),content=document.getElementById('modalContent'),menuButton=document.getElementById('menuToggle');
const key='harborPointModule13PreviewV1';let state={section:0,completed:Array(8).fill(false),reflections:['','','','']};try{const s=JSON.parse(localStorage.getItem(key));if(s&&Array.isArray(s.completed))state={...state,...s}}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
function menu(){nav.innerHTML='<div class="m13-progress">'+state.completed.filter(Boolean).length+' of 8 sections complete</div>'+topics.map(([t,s],i)=>`<button class="menu-item" data-jump="${i}"><span class="menu-heading">${i+1}. ${t}${state.completed[i]?' ✓':''}</span><span class="menu-subheading">${s}</span></button>`).join('')}
function section(n){state.section=n;save();menu()}
function close(){overlay.classList.add('hidden');content.innerHTML=''}
function modal(title,body){content.innerHTML=`<h2 id="dialogTitle" tabindex="-1">${title}</h2>`+body;overlay.classList.remove('hidden');content.querySelector('h2').focus()}
function buttons(items){return `<div class="m13-modal-actions">${items.map(([txt,action])=>`<button class="primary-btn" data-action="${action}">${txt}</button>`).join('')}</div>`}
function intro(){section(0);close();main.innerHTML=`<section class="intro-scene"><div class="intro-panel"><span class="mini-label">Harbor Point · Module 13</span><h1>Group Therapy,<br>Part 2</h1><div class="intro-rule"></div><p class="intro-lead">Group therapy is more than bringing people together to discuss their experiences. As members build relationships, establish trust, navigate disagreements, and support one another, the group develops in ways that can influence each person's recovery.</p><p class="intro-copy">This week, you'll return to Harbor Point to explore how therapeutic groups develop, the different roles members may take on, and how group dynamics influence participation, communication, and progress.</p><p class="intro-copy">You'll also examine the stages of group development, how clients' needs change throughout treatment, and the strategies counselors use to encourage healthy interactions, manage conflict, maintain safety, and support recovery. Through realistic scenarios, you'll practice recognizing group dynamics and responding appropriately while working within your role as a CDCA.</p>${buttons([['Enter Harbor Point →','exterior']])}</div></section>`}
function exterior(){close();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.outside}')"><div class="scene-title-card m13-exterior-card" style="top:110px;left:7%;text-align:left"><span class="mini-label">Week 13 · Back at Harbor Point</span><h1>Harbor Point Recovery Services</h1><p>Maria is waiting to introduce your next group therapy experience.</p></div><button type="button" class="m13-hotspot" aria-label="Enter Harbor Point through the doors" data-action="mariaScene" style="left:52%;top:34%;width:18%;height:36%"></button></div></section>`}
function scene(image,background,guide,action,name){close();main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${background}')"><div class="scene-guide">${guide}</div><img class="m13-person" src="${image}" alt=""><button class="m13-hotspot" style="left:39%;top:27%;height:62%;width:22%" data-action="${action}" aria-label="Talk with ${name}"></button></div></section>`}
function mariaScene(){scene(IMG.maria,IMG.office,'Maria has an introduction to your second week of group therapy.','mariaTalk','Maria')}
function mariaTalk(){modal('Welcome Back to Harbor Point',`<p>Last week, you explored why group therapy matters, different types of groups, and ways to support a safe and respectful environment.</p><p>This week, you will look more closely at <strong>how groups grow and change</strong>, and how each member can influence the group.</p><p>Now, Daniel will guide you through group roles, development, and the facilitator's responsibilities.</p>${buttons([['Meet with Daniel →','danielScene']])}`)}
function danielScene(){scene(IMG.daniel,IMG.training,'Daniel wants to introduce how groups develop and how members contribute.','danielTalk','Daniel')}
function danielTalk(){modal('Learning Together',`<p>A group is not simply a collection of people receiving counseling at the same time. Members influence one another through listening, feedback, disagreement, and shared experiences.</p><p>Your job is to notice what is happening across the group and consider how a CDCA can support healthy dynamics while working with qualified facilitators.</p>${buttons([['Explore Group Roles →','rolesIntro']])}`)}
function rolesIntro(){section(1);modal('Different Members, Different Roles',`<div class="m13-color-scene" data-visual="Different Members, Different Roles"><p>Members may participate in different ways from one session to the next. A quiet member may be listening closely; a frequent speaker may be eager to help. Labels describe <em>patterns of behavior</em>, not permanent identities.</p><div class="m13-cards"><article class="m13-card"><h3>Facilitator</h3><p>Sets structure and tone, protects safety, invites participation, and addresses group dynamics.</p></article><article class="m13-card"><h3>Active participant</h3><p>Shares experiences, listens, and engages in activities.</p></article><article class="m13-card"><h3>Supporter</h3><p>Offers empathy, encouragement, and constructive feedback.</p></article><article class="m13-card"><h3>Observer or quiet member</h3><p>May listen before feeling comfortable enough to speak.</p></article><article class="m13-card"><h3>Dominant member</h3><p>May speak often or interrupt, sometimes without realizing it.</p></article><article class="m13-card"><h3>Distracted or withdrawn member</h3><p>May be experiencing anxiety, ambivalence, or barriers to participation.</p></article><article class="m13-card"><h3>Challenger</h3><p>Questions ideas or expectations; respectful questions can deepen reflection.</p></article><article class="m13-card"><h3>New member</h3><p>Is learning the group's norms and may need orientation and time to build trust.</p></article></div></div>${buttons([['Observe the Group →','rolesObserve']])}`)}
function rolesScene(){scene(IMG.daniel,IMG.group,'Daniel invites you to observe how members contribute to the group.','rolesObserve','Daniel')}
function rolesObserve(){modal('Noticing Roles in Action',`<p>Imagine Jamal, Tanya, and Krishna attending a facilitated recovery group. Tanya often has ideas to share. Jamal listens closely before speaking. Krishna asks whether the group expectations apply to everyone.</p><div class="client-lineup"><div><img src="${IMG.jamal}" alt="Jamal"><strong>Jamal</strong></div><div><img src="${IMG.tanya}" alt="Tanya"><strong>Tanya</strong></div><div><img src="${IMG.krishna}" alt="Krishna"><strong>Krishna</strong></div></div><p><strong>Important:</strong> None of these behaviors alone tells us whether someone is motivated or benefiting from treatment. A facilitator should stay curious and respond to the behavior, rather than assign a fixed label.</p>${buttons([['Practice Responding →','rolesQuestion']])}`)}
function rolesQuestion(){const body=`<div class="m13-scenario"><div class="m13-head"><img src="${IMG.tanya}" alt="Tanya"><div><p>Tanya interrupts Jamal twice while he is trying to describe what helped him get to treatment. Jamal becomes quiet.</p><p class="m13-question">How could the facilitator respond in a way that supports the whole group?</p></div></div></div><div class="m13-options" role="group" aria-label="Choose a response">${[['A','Tell Tanya that she cannot speak for the rest of the session.'],['B','Thank Tanya for participating, set a respectful turn-taking expectation, and invite Jamal to continue if he wishes.'],['C','Ask Jamal to speak more loudly so he is not interrupted.'],['D','Ignore the interruption so the group can manage itself.']].map(([k,t])=>`<button class="m13-option" data-answer="${k}"><strong>${k}.</strong> ${t}</button>`).join('')}</div><div id="answerFeedback" class="m13-feedback" role="status" aria-live="polite"></div><div id="answerContinue"></div>`;modal('Group Roles: A Facilitation Decision',body)}
function correct(){document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);document.getElementById('answerContinue').innerHTML=buttons([['What Comes Next? →','section2Wrap']]);}
function section2Wrap(){state.completed[0]=true;state.completed[1]=true;save();menu();modal('Roles Can Change Over Time',`<p>When a group changes, member behavior can change, too. A newcomer may become an active supporter; an outspoken member may learn to listen more carefully. The facilitator notices patterns without defining people by them.</p><p>Next, we will explore how a group is formed, how members are prepared, and why the group's stage of development matters.</p><div class="m13-resource"><strong>Optional resource:</strong> <a href="https://library.samhsa.gov/sites/default/files/sma15-3991.pdf" target="_blank" rel="noopener noreferrer">Open SAMHSA TIP 41</a><p>Chapters 4–6 provide background on group development, treatment stages, and group leadership. Everything needed for this lesson will be taught in the module, but this is a great resource to keep for your future work as a CDCA.</p></div>${buttons([['Explore Group Preparation →','prepIntro']])}`)}

// SECTION 3 — GROUP MEMBERSHIP AND PREPARATION
function prepScene(){section(2);scene(IMG.daniel,IMG.training,'Daniel wants you to consider how clients get ready to join a group.','prepIntro','Daniel')}
function prepIntro(){section(2);modal('Preparing for Group Therapy',`<p>Starting a new group can feel uncertain. A thoughtful introduction helps a client understand the group's purpose, expectations, and choices before their first session.</p><p>Group composition matters, too. Some groups begin with a stable set of members, while others welcome new people throughout treatment.</p>${buttons([['Explore Group Membership →','prepMembership']])}`)}
function prepMembership(){modal('Fixed and Revolving Membership',`<div class="m13-color-scene" data-visual="Fixed and Revolving Membership"><div class="m13-cards m13-membership-cards"><article class="m13-card"><h3>Fixed-membership group</h3><p>The same members generally participate throughout a defined period. Familiarity may support continuity and trust, though members who miss the start may have to wait for another group.</p></article><article class="m13-card"><h3>Revolving-membership group</h3><p>People enter or leave at different times. This can improve access to treatment, while requiring clear orientation and renewed attention to group expectations when new members join.</p></article></div><p><strong>Neither format is always better.</strong> Consider the group's purpose, setting, members' needs, and guidance from the qualified group facilitator.</p></div>${buttons([['How Do We Prepare a New Member? →','prepChecklist']])}`)}
function prepChecklist(){modal('Before the First Group Session',`<div class="m13-color-scene" data-visual="Before the First Group Session"><p>A pregroup conversation gives the treatment team an opportunity to build trust, answer questions, and consider whether the group is a good fit.</p><div class="m13-cards"><article class="m13-card"><h3>Explain the purpose</h3><p>What will the group work on, and how does this connect with the client's goals?</p></article><article class="m13-card"><h3>Discuss participation</h3><p>Clarify meeting format, attendance, activities, and that personal disclosure should not be forced.</p></article><article class="m13-card"><h3>Review the group agreement</h3><p>Discuss respect, privacy, boundaries, and the limits of confidentiality. Avoid promising absolute confidentiality from peers.</p></article><article class="m13-card"><h3>Consider practical needs</h3><p>Ask about transportation, schedule, language, accessibility, and other barriers that could affect participation.</p></article></div><p>Screening, placement, and clinical decisions are handled by appropriately qualified staff. CDCAs can reinforce the plan, support preparation, observe concerns, and communicate with their supervisor.</p></div>${buttons([['Practice Group Preparation →','prepCase1']])}`)}
function prepCase1(){prepCase(0)}
function prepCase2(){prepCase(1)}
function prepCase3(){prepCase(2)}
const preparationCases=[
{title:'A New Member Arrives',names:['Jamal'],stem:'Jamal is about to attend his first recovery group. He asks whether he will have to tell everyone his full history today.',question:'Which response best prepares him?',options:['Tell him every member has to explain their full history during the first session.','Ask him to wait until he is completely comfortable discussing everything.','Promise that anything he says can never be repeated by another member.','Explain what participation usually involves, review group expectations, and let him know he can choose what he feels ready to share.'],answer:3,why:'Orientation and choice can lower uncertainty without making unrealistic confidentiality promises or forcing disclosure.'},
{title:'Joining an Ongoing Group',names:['Krishna'],stem:'Krishna has been referred to a group that accepts new participants each week. He worries that everyone else already knows the rules.',question:'What would help him join the group?',options:['Assume he will learn the agreement by listening over several weeks.','Tell the existing members to stop discussing recovery while Krishna catches up.','Arrange an orientation to the purpose, group agreement, and expectations, with appropriate facilitator support.','Require Krishna to speak first so the established members can evaluate him.'],answer:2,why:'Revolving groups need deliberate orientation so new members know the purpose and expectations and can join safely.'},
{title:'A Practical Barrier',names:['Tanya'],stem:'Tanya wants to attend a weekly group but says her work schedule may prevent her from coming regularly.',question:'What is the most helpful next step within a CDCA support role?',options:['Ask about the scheduling barrier and help communicate her needs to the treatment team to explore available options.','Tell her that attendance barriers mean she does not care about recovery.','Guarantee that the group schedule will change for her.','Tell her she must select a different form of treatment without discussing it with the team.'],answer:0,why:'Explore the barrier without judgment and bring the information to the appropriate team members rather than making unilateral placement decisions.'}
];
function prepCase(i){const c=preparationCases[i];const pics=c.names.map(n=>`<img src="${IMG[n.toLowerCase()]}" alt="${n}" />`).join('');modal(`Group Preparation: ${i+1} of 3`,`<div class="m13-scenario"><div class="m13-head">${pics}<div><p>${c.stem}</p><p class="m13-question">${c.question}</p></div></div></div><div class="m13-options" role="group" aria-label="Choose the most helpful response">${c.options.map((opt,j)=>`<button type="button" class="m13-option" data-prep-answer="${j}" data-prep-case="${i}"><strong>${'ABCD'[j]}.</strong> ${opt}</button>`).join('')}</div><div class="m13-feedback" id="prepFeedback" aria-live="polite" role="status"></div><div id="prepContinue"></div>`)}
function prepFinish(){state.completed[2]=true;save();menu();modal('Preparing Members for Success',`<p>Preparing people for group therapy begins before the first session. Explain the purpose and expectations, reinforce the group agreement, address practical barriers, and bring placement or clinical questions to qualified team members.</p><p>In the next section, we'll look at how groups move through different phases and why the facilitator's approach changes as relationships develop.</p><div class="m13-resource"><strong>Optional resource:</strong> <a href="https://library.samhsa.gov/sites/default/files/sma15-3991.pdf" target="_blank" rel="noopener noreferrer">Open SAMHSA TIP 41</a><p>Chapter 4 describes fixed and revolving membership, preparing clients, group agreements, and phases of group development. </p></div>${buttons([['Explore Group Development →','developmentIntro']])}`)}


// SECTION 4 — HOW GROUPS DEVELOP
function developmentScene(){section(3);scene(IMG.daniel,IMG.training,'Daniel wants you to explore how group relationships change over time.','developmentIntro','Daniel')}
function developmentIntro(){section(3);modal('How Groups Develop',`<p>A recovery group does not become trusting and productive in a single meeting. People learn the expectations, test boundaries, establish working relationships, and eventually prepare for an ending or transition.</p><p>The group's <strong>stage of development</strong> describes what is happening <em>between members</em>. It is different from an individual client's stage of recovery, which we will explore a little later.</p>${buttons([['Explore the Phases →','developmentPhases']])}`)}
function developmentPhases(){modal('Beginning, Middle, and Ending Phases',`<div class="m13-color-scene" data-visual="Beginning, Middle, and Ending Phases"><div class="m13-cards"><article class="m13-card"><h3>Beginning: Orientation and safety</h3><p>People may feel uncertain, quiet, or cautious. The facilitator welcomes members, explains purpose and agreements, establishes respectful norms, and invites participation without forcing disclosure.</p></article><article class="m13-card"><h3>Middle: Working together</h3><p>Members develop trust, exchange feedback, practice skills, and sometimes disagree. The facilitator helps members communicate directly, address conflict constructively, and learn from each other.</p></article><article class="m13-card"><h3>Ending: Closure and transition</h3><p>Members review gains, recognize feelings about separation, identify continued supports, and plan next steps. The facilitator provides a purposeful ending instead of stopping abruptly.</p></article></div><p>These phases are a helpful guide, not a rigid sequence. For example, a new member joining a revolving group may bring new orientation needs even when established members are working well together.</p></div>${buttons([['See Development in Action →','developmentExample']])}`)}
function developmentExample(){modal('Development Is Not Always Linear',`<div class="m13-color-scene" data-visual="Development Is Not Always Linear"><p>Imagine a group that has met for several weeks. Members have begun to offer thoughtful feedback. When Krishna joins, he is unfamiliar with the group's routines and asks whether he must share his full story. The others may be in a working phase, while Krishna needs an introduction.</p><div class="m13-cards"><article class="m13-card"><h3>Support the newcomer</h3><p>Revisit relevant expectations and provide a welcoming, pressure-free orientation.</p></article><article class="m13-card"><h3>Keep the group moving</h3><p>Help established members remain engaged while making room for Krishna to learn the norms.</p></article></div><p>Facilitators respond to the needs of the whole group and its individual members, rather than assuming everyone is at exactly the same point.</p></div>${buttons([['Practice Group Development →','developmentCase1']])}`)}
const developmentCases=[

// SECTION 5 — STAGES OF TREATMENT
function treatmentScene(){section(4);scene(IMG.daniel,IMG.training,'Daniel wants you to consider how a client’s needs may change over the course of treatment.','treatmentIntro','Daniel')}
function treatmentIntro(){section(4);modal('Stages of Treatment',`<p>Earlier, you learned that a <strong>group</strong> can move through beginning, middle, and ending phases. Here, the focus shifts to the <strong>individual client’s</strong> stage of treatment. Two people in the same group may need different kinds of support.</p><p>SAMHSA’s TIP 41 describes early, middle, and late stages of treatment. These are useful general patterns, not labels to apply automatically or a fixed timetable. People may move forward, experience setbacks, and need reassessment.</p>${buttons([['Explore Treatment Stages →','treatmentStages']])}`)}
function treatmentStages(){modal('Early, Middle, and Late Treatment',`<div class="m13-color-scene" data-visual="Early, Middle, and Late Treatment"><div class="m13-cards"><article class="m13-card"><h3>Early treatment: Engagement and stabilization</h3><p>Clients may be unsure about change, worried about judgment, or focused on immediate concerns. The facilitator explains expectations, builds safety and trust, uses accessible language, and coordinates support for urgent or practical needs.</p><p><strong>Helpful approach:</strong> Offer choices, invite rather than demand disclosure, and recognize small steps toward participation.</p></article><article class="m13-card"><h3>Middle treatment: Skills and sustained change</h3><p>Clients may have more familiarity with recovery strategies but still face cravings, conflict, and setbacks. Groups can help members practice coping skills, examine patterns, exchange constructive feedback, and strengthen supportive connections.</p><p><strong>Helpful approach:</strong> Promote respectful peer learning, reinforce progress, and discuss realistic responses to triggers.</p></article><article class="m13-card"><h3>Later treatment: Growth and continuing support</h3><p>Some clients are ready for deeper reflection, strengthening relationships, taking on responsibilities, and planning for transitions. The focus may include maintaining gains and identifying community supports.</p><p><strong>Helpful approach:</strong> Help clients recognize strengths, identify ongoing supports, and plan for changes in services.</p></article></div><p><strong>Important:</strong> A person's stage of treatment does not alone determine group placement or safety. The qualified team considers current functioning, needs, preferences, and clinical concerns.</p></div>${buttons([['See How Support Changes →','treatmentCompare']])}`)}
function treatmentCompare(){modal('One Group, Different Needs',`<p>Imagine Jamal, Tanya, and Krishna attending a professionally facilitated recovery group. They can benefit from the same supportive environment while needing different things from it.</p><div class="m13-cards"><article class="m13-card"><div class="m13-tile-person"><img src="${IMG.jamal}" alt="Portrait of Jamal"><h3>Jamal: Building comfort</h3></div><p>Jamal is new and asks whether he has to discuss personal experiences right away. He may benefit from clear expectations, a welcoming tone, and permission to participate at his own pace.</p></article><article class="m13-card"><div class="m13-tile-person"><img src="${IMG.tanya}" alt="Portrait of Tanya"><h3>Tanya: Practicing change</h3></div><p>Tanya wants to use the coping strategies she has been learning, but she struggles to pause and listen when a peer speaks. She may benefit from skill practice and respectful feedback.</p></article><article class="m13-card"><div class="m13-tile-person"><img src="${IMG.krishna}" alt="Portrait of Krishna"><h3>Krishna: Revisiting support needs</h3></div><p>Krishna has made progress but recently resumed substance use. He may need a supportive conversation and a private follow-up with qualified staff rather than blame or assumptions about his recovery.</p></article></div><p><strong>What matters:</strong> The counselor responds to each person's current needs without assuming that everyone follows the same path.</p>${buttons([['Practice Supporting Clients →','treatmentCase1']])}`)}
const treatmentCases=[
{names:['Jamal'],stem:'Jamal has attended only one recovery group. He sits quietly and says, “I’m not sure I belong here. I’m not ready to share much.”',question:'What is the most appropriate response for someone getting started in treatment?',options:['Ask him to share his complete history so the group can get to know him.','Tell him that silence means group treatment will not work for him.','Explain the group expectations, acknowledge his concerns, and allow him to participate without forced disclosure.','Ask another member to describe why Jamal should trust everyone.'],answer:2,why:'Early engagement is supported by predictable expectations, a welcoming relationship, and choice about disclosure.'},
{names:['Tanya'],stem:'Tanya has been attending group for several weeks. She understands several coping techniques, but she says she forgets to use them when arguments become stressful.',question:'Which activity would best support continued skill development?',options:['Have her memorize a list of coping terms without discussing when she might use them.','Suggest that she stop attending group because she already knows the techniques.','Help her practice a coping response to a realistic conflict and invite constructive peer feedback.','Ask the other members to decide which strategy Tanya must follow.'],answer:2,why:'During ongoing treatment, realistic practice and respectful feedback can help clients apply strategies beyond the group setting.'},
{names:['Krishna'],stem:'Krishna says he resumed substance use after a stressful week. He is embarrassed and worries that the group will think his earlier progress no longer counts.',question:'What response best supports his treatment needs?',options:['Acknowledge his honesty, avoid shame, and coordinate a private follow-up with qualified staff as indicated.','Announce that he must return to the first stage of treatment regardless of his current needs.','Ask every group member to question him about exactly what happened.','Promise to keep the disclosure secret from the treatment team even if safety needs arise.'],answer:0,why:'Treatment is not strictly linear. Respond respectfully, consider immediate safety, and involve qualified staff for appropriate reassessment and follow-up.'},
{names:['Jamal','Tanya'],stem:'One group member is newly engaged in treatment, while another is considering how to maintain gains and stay connected after a program ends.',question:'What should guide how they are supported?',options:['Give every group member exactly the same task because the group meets together.','Base the response only on the number of sessions each person has attended.','Treat the later-stage client as responsible for counseling the newer member.','Adapt support to each client’s needs, goals, and readiness while maintaining group safety and professional boundaries.'],answer:3,why:'Group care can be individualized without losing the group’s shared purpose or placing clinical responsibilities on peers.'}
];

function treatmentFinish(){state.completed[4]=true;save();menu();modal('Supporting Clients Across Treatment',`<p>Client needs may change as treatment continues. Early work often emphasizes engagement and safety; middle-stage work may emphasize practicing change and learning from peers; later work can include strengthening gains and planning ongoing support.</p><p>A client's progress is not a straight line. Keep listening, check assumptions, respect autonomy, and seek qualified clinical guidance for treatment decisions or safety concerns.</p><div class="m13-resource"><strong>Optional resource:</strong> <a href="https://library.samhsa.gov/sites/default/files/sma15-3991.pdf" target="_blank" rel="noopener noreferrer">Open SAMHSA TIP 41</a><p>Chapter 5 discusses adapting group work across treatment stages. </p></div>${buttons([['Explore Group Dynamics →','dynamicsIntro']])}`)}


// SECTION 6 — FACILITATING GROUP DYNAMICS
function dynamicsScene(){section(5);scene(IMG.daniel,IMG.group,'Daniel will help you notice group interactions and decide when support is needed.','dynamicsIntro','Daniel')}
function dynamicsIntro(){section(5);modal('Facilitating Group Dynamics',`<p>In a therapeutic group, the facilitator pays attention to <strong>what is being said</strong> and <strong>how members interact</strong>. Helpful group work is not simply a series of individual conversations with the leader. Members also learn by listening to and supporting one another.</p><p>SAMHSA’s TIP 41 describes the importance of attentive listening, emotional safety, thoughtful interventions, and understanding how different members affect the group as a whole.</p>${buttons([['Explore Group Interactions →','dynamicsPatterns']])}`)}
function dynamicsPatterns(){modal('Notice the Whole Group',`<div class="m13-color-scene" data-visual="Notice the Whole Group"><div class="m13-cards"><article class="m13-card"><h3>Participation patterns</h3><p>Notice who speaks frequently, who tries to enter the conversation, and who appears uncomfortable. Do not assume that a quiet person is uninterested.</p></article><article class="m13-card"><h3>Peer-to-peer learning</h3><p>Support respectful exchanges between members, rather than directing every comment back to the facilitator. Peers can offer empathy and share experiences without being asked to provide clinical advice.</p></article><article class="m13-card"><h3>Emotional tone</h3><p>Pay attention to frustration, fear, withdrawal, and how one person's reaction may influence others. A facilitator may slow a discussion or reinforce boundaries when needed.</p></article><article class="m13-card"><h3>Group norms and subgroups</h3><p>Observe patterns such as interruptions, exclusion, or a few members repeatedly speaking only to each other. Invite inclusion without labeling or embarrassing participants.</p></article></div></div>${buttons([['Learn When to Intervene →','dynamicsIntervene']])}`)}
function dynamicsIntervene(){modal('When Should a Facilitator Intervene?',`<div class="m13-color-scene" data-visual="When Should a Facilitator Intervene?"><p>Interventions are purposeful actions that affect the direction or interactions of a group. Effective facilitators use them when they serve a clear purpose, rather than responding to every comment.</p><div class="m13-cards"><article class="m13-card"><h3>Invite</h3><p>Offer members a chance to contribute without requiring disclosure: “Would anyone like to add another perspective?”</p></article><article class="m13-card"><h3>Reflect or summarize</h3><p>Bring attention to shared themes: “Several people have described feeling isolated before finding support.”</p></article><article class="m13-card"><h3>Redirect with respect</h3><p>Protect participation and boundaries: “Let's allow each person to finish before responding.”</p></article><article class="m13-card"><h3>Pause and seek clinical support</h3><p>When distress, conflict, or safety concerns exceed the CDCA role, follow program procedures and involve the supervising clinician.</p></article></div><p><strong>Practice reminder:</strong> Respectful disagreement can support learning; insults, coercion, and threats call for stronger boundaries and, when indicated, immediate help from qualified staff.</p></div>${buttons([['Observe a Group Conversation →','dynamicsObserve']])}`)}
function dynamicsObserve(){modal('Three Members, One Group',`<p>Jamal is trying to explain what helped him attend his first recovery meeting. Tanya is eager to share ideas and starts talking over him. Krishna glances at the floor and becomes quiet.</p><div class="m13-scenario"><div class="m13-head"><img src="${IMG.jamal}" alt="Jamal"><img src="${IMG.tanya}" alt="Tanya"><img src="${IMG.krishna}" alt="Krishna"><div><p>A facilitator should notice <strong>the interaction</strong>, not just Tanya's words. Jamal's chance to speak has been interrupted, and Krishna's silence might have many possible explanations.</p></div></div></div><p>A helpful response sets a respectful boundary, allows Jamal to choose whether to continue, and makes room for others without requiring them to speak.</p>${buttons([['Practice Facilitation Decisions →','dynamicsCase1']])}`)}
const dynamicsCases=[
{names:['Jamal','Tanya'],stem:'Jamal begins describing a coping strategy that helped him this week. Tanya interrupts twice to explain what she thinks he should do.',question:'What is the best next step for the qualified facilitator?',options:['Let Tanya continue because she seems confident.','Respectfully ask members to let each person finish and invite Jamal to continue if he wants.','Tell Jamal he needs to speak faster if he wants to be heard.','Ask the group to vote on whether Tanya should keep talking.'],answer:1,why:'A calm boundary protects everyone’s opportunity to participate without shaming Tanya or forcing Jamal to disclose.'},
{names:['Jamal','Krishna'],stem:'Jamal says that feeling alone made recovery harder. Krishna says quietly, “I think I know what you mean.” Both look toward the facilitator.',question:'How could the facilitator support peer connection?',options:['Ask Jamal and Krishna whether they would like to respond to each other.','Explain that members must direct all comments to the facilitator.','Require Krishna to share his full substance use history.','Change the subject before anyone becomes emotional.'],answer:0,why:'With their permission, inviting members to respond to each other helps the group become a source of learning and support.'},
{names:['Tanya','Krishna'],stem:'Tanya disagrees with a suggestion Krishna offered. Both remain respectful, listen to each other, and describe different experiences.',question:'What response best supports healthy group dynamics?',options:['Immediately stop the discussion because any disagreement is harmful.','Tell them which person has the better recovery strategy.','Allow the respectful exchange, helping clarify ideas if needed while monitoring safety.','Ask everyone else to stay silent until they agree.'],answer:2,why:'Disagreement is not inherently unsafe. Thoughtful discussion can help members examine perspectives and practice communication.'},
{names:['Jamal','Tanya','Krishna'],stem:'During a session, several members appear distressed after one participant raises their voice and begins making threatening comments. You are assisting the qualified facilitator.',question:'What is the most appropriate action within a CDCA support role?',options:['Ignore the threats and hope the group settles down.','Ask the distressed members to manage the situation themselves.','Continue the planned activity without acknowledging the concern.','Follow the safety procedures immediately and seek direction from the qualified facilitator or clinical team.'],answer:3,why:'Threats and escalating distress require prompt attention to safety and coordination with qualified staff, not independent clinical management.'}
];

function dynamicsFinish(){state.completed[5]=true;save();menu();modal('Guiding Group Interactions',`<p>Effective group facilitation includes attending to participation, encouraging safe peer learning, setting respectful limits, and noticing when the group needs additional support.</p><p>As a CDCA, support the qualified facilitator, reinforce agreed expectations, observe changes in the group, and raise concerns that require clinical judgment or safety intervention.</p><div class="m13-resource"><strong>Optional resource:</strong> <a href="https://library.samhsa.gov/sites/default/files/sma15-3991.pdf" target="_blank" rel="noopener noreferrer">Open SAMHSA TIP 41</a><p>Chapter 6 explores group leadership and interventions. </p></div>${buttons([['Respond to Challenges →','challengesIntro']])}`)}


// SECTION 7 — RESPONDING TO CHALLENGES
function challengesScene(){section(6);scene(IMG.daniel,IMG.group,'Daniel will help you respond to challenging moments in a recovery group.','challengesIntro','Daniel')}
function challengesIntro(){modal('Responding to Challenges',`<p>Even a supportive group can experience conflict, withdrawal, hurtful comments, and intense emotions. The goal is not to prevent every disagreement. It is to protect safety, uphold group agreements, and help members communicate respectfully.</p><p>As a CDCA assisting a qualified group facilitator, you can observe patterns, reinforce expectations as directed, and promptly report concerns. Clinical decisions and emergencies require qualified staff and established procedures.</p>${buttons([['Explore Common Challenges →','challengesPatterns']])}`)}
function challengesPatterns(){modal('Common Challenges and Helpful Responses',`<div class="m13-color-scene" data-visual="Common Challenges and Helpful Responses"><div class="m13-cards"><article class="m13-card"><h3>Interruptions and unequal participation</h3><p>Invite balanced participation, remind members to let others finish, and respect a person's choice not to speak.</p></article><article class="m13-card"><h3>Conflict and hurtful comments</h3><p>Distinguish respectful disagreement from personal insults or threats. Redirect harmful language and restore appropriate boundaries.</p></article><article class="m13-card"><h3>Subgroups and exclusion</h3><p>Notice when a few members repeatedly align, ignore others, or speak for the group. Encourage inclusive conversation without assigning labels or motives.</p></article><article class="m13-card"><h3>Privacy and confidentiality</h3><p>Revisit group agreements, do not promise absolute secrecy among members, and report suspected privacy breaches under program policy.</p></article><article class="m13-card"><h3>Renewed use and shame</h3><p>Respond respectfully to disclosures. Avoid public interrogation; coordinate clinical and safety follow-up as needed.</p></article><article class="m13-card"><h3>Emotional distress and risk</h3><p>Attend to warning signs, pause the activity when appropriate, and promptly involve qualified clinical or emergency support according to procedures.</p></article></div></div>${buttons([['Observe a Difficult Group Moment →','challengesObserve']])}`)}
function challengesObserve(){modal('When Group Dynamics Become Difficult',`<p>Jamal begins sharing something that helped him during a difficult week. Tanya interrupts with advice. Krishna tries to speak but stops as the discussion becomes tense.</p><div class="m13-scenario"><div class="m13-head"><img src="${IMG.jamal}" alt="Jamal"><img src="${IMG.tanya}" alt="Tanya"><img src="${IMG.krishna}" alt="Krishna"><div><p>One interaction can affect the whole group. A qualified facilitator might remind everyone of respectful turn-taking, invite Jamal to continue if he wishes, and check whether others want to contribute.</p></div></div></div><p>Notice the difference between <strong>observing a behavior</strong> and <strong>assuming why someone behaves that way</strong>. A CDCA can describe what happened and share concerns with the supervising clinician without diagnosing a participant's intentions.</p>${buttons([['Practice Group Decisions →','challengesCase1']])}`)}
const challengesCases=[
 {names:['Jamal','Tanya'],stem:'Jamal starts describing a difficult week. Tanya interrupts: “That won’t work. You should just do what I do.” Jamal stops speaking.',question:'What is the best response for the qualified facilitator?',options:['Remind members to let each other finish and invite Jamal to continue if he chooses.','Tell Jamal that he must finish his story so Tanya can learn a lesson.','Let Tanya continue because she is trying to help.','Ask the group to decide which member has better advice.'],answer:0,why:'A respectful interruption of the pattern protects participation without humiliating Tanya or requiring Jamal to disclose.'},
 {names:['Tanya','Krishna'],stem:'Tanya and Krishna disagree about whether a particular coping strategy is useful. The disagreement becomes personal when one says, “You clearly don’t care about recovery.”',question:'What should the facilitator do next?',options:['Ask them to debate until one admits being wrong.','Ignore the comment because disagreement always leads to growth.','Pause the exchange, restate respectful communication expectations, and help members discuss experiences without insults.','End group permanently because members disagreed.'],answer:2,why:'A personal attack calls for a clear boundary. Members can still explore different perspectives without shame or insults.'},
 {names:['Jamal','Tanya','Krishna'],stem:'Over several meetings, two members respond mostly to each other and dismiss Jamal’s attempts to contribute. Jamal has begun withdrawing from discussion.',question:'What is the most helpful response?',options:['Tell Jamal his withdrawal is his own problem.','Notice the exclusion pattern and invite broader participation without blaming or labeling members.','Separate the two members immediately without consulting the facilitator.','Require everyone to share equally personal information.'],answer:1,why:'Attention to subgroup patterns can protect inclusion while respecting each person’s boundaries and the qualified facilitator’s role.'},
 {names:['Jamal','Krishna'],stem:'Krishna reports that another group member posted details from Jamal’s recovery story on social media. Jamal is upset and unsure whether the group is safe.',question:'What is the best immediate approach?',options:['Promise that the post will never be seen by anyone else.','Tell Jamal to ignore it so the group can continue.','Ask the group to vote on whether it was a privacy violation.','Take the concern seriously, notify the qualified facilitator, and follow program confidentiality and incident procedures.'],answer:3,why:'Possible privacy breaches require a timely, policy-based response; no one should promise confidentiality that cannot be guaranteed.'},
 {names:['Krishna','Tanya'],stem:'After a tense discussion, a group member says, “I might hurt myself tonight.” Tanya asks everyone to keep the statement secret because the member trusted the group.',question:'What should you do as a CDCA assisting the facilitator?',options:['Agree to secrecy to protect the person’s trust.','Wait until the next meeting to see whether the feeling passes.','Immediately alert the qualified facilitator and follow the program’s urgent safety procedures.','Ask the group to handle the situation through peer advice.'],answer:2,why:'Potential self-harm requires immediate safety action with qualified clinical or emergency support; confidentiality does not mean ignoring urgent risk.'}
];

function challengesFinish(){state.completed[6]=true;save();menu();modal('Supporting Safety and Respect',`<p>Effective support for group therapy involves noticing patterns, protecting dignity, reinforcing group agreements, and knowing when a concern needs immediate attention.</p><p>As a CDCA, observe and communicate concerns to the qualified facilitator. Do not independently manage clinical emergencies or promise that information can always remain secret.</p><div class="m13-resource"><strong>Optional resource:</strong> <a href="https://library.samhsa.gov/sites/default/files/sma15-3991.pdf" target="_blank" rel="noopener noreferrer">Open SAMHSA TIP 41</a><p>Chapter 6 discusses group leadership and challenging interactions. </p></div>${buttons([['Begin Group Therapy in Practice →','practiceIntro']])}`)}

function practiceScene(){section(7);scene(IMG.daniel,IMG.group,'Daniel is ready to guide you through a group session.','practiceIntro','Daniel')}
function practiceIntro(){section(7);modal('Group Therapy in Practice',`<p>You are assisting a qualified group facilitator at Harbor Point. Jamal, Tanya, and Krishna are participating. The situation unfolds across seven decisions, so consider the needs of the individual and the group.</p><div class="client-lineup"><div><img src="${IMG.jamal}" alt="Jamal"><strong>Jamal</strong></div><div><img src="${IMG.tanya}" alt="Tanya"><strong>Tanya</strong></div><div><img src="${IMG.krishna}" alt="Krishna"><strong>Krishna</strong></div></div><p>Apply what you've learned about preparing members, noticing group dynamics, supporting different treatment needs, maintaining safety, and working within the CDCA role.</p>${buttons([['Begin the Group Session →','practiceCase1']])}`)}
const practiceCases=[
 {names:['Jamal'],stem:'Before the session, Jamal says, “I am nervous about joining. I have never been part of a group like this.”',question:'How should you support his introduction to the group?',options:['Tell him every member must share a personal story in the first meeting.','Review the purpose, expectations, and group agreement; invite questions without pressuring him to disclose.','Assure him that no other member will ever repeat anything discussed.','Ask him to wait until he feels completely confident before attending.'],answer:1,why:'Orientation, clear expectations, and choices help a new member prepare while respecting their comfort and confidentiality limits.'},
 {names:['Tanya','Jamal'],stem:'During a discussion, Tanya speaks over Jamal twice. Jamal starts to respond but falls silent.',question:'What response best supports the group?',options:['Ask Tanya to leave immediately without discussing what happened.','Continue without responding, because the discussion is still on topic.','Respectfully ask members to let each speaker finish and invite Jamal to continue if he wants.','Require Jamal to speak next so that everyone participates equally.'],answer:2,why:'A respectful reminder protects balanced participation without shaming Tanya or forcing Jamal to speak.'},
 {names:['Jamal','Krishna'],stem:'Jamal talks about feeling alone in early recovery. Krishna says, “I felt that way too, and another member helped me feel less alone.”',question:'How can the facilitator build on this interaction?',options:['Thank Krishna and invite supportive peer discussion while keeping the focus on the group’s purpose.','Redirect all comments back to the facilitator so peers do not influence each other.','Ask Jamal to disclose more personal details before others respond.','End the discussion because the members are at different treatment stages.'],answer:0,why:'Member-to-member connection is an important part of therapeutic group work when it is safe, respectful, and supported.'},
 {names:['Krishna'],stem:'Krishna tells the group he recently used again. He seems ashamed and says he almost skipped the session.',question:'What is the most appropriate response?',options:['Ask the group to question him about exactly why he used.','Tell Krishna his disclosure means he has failed treatment.','Promise there is no need to tell the clinical team.','Respond without judgment, affirm his honesty, and coordinate appropriate private follow-up with the qualified clinician.'],answer:3,why:'A compassionate response protects dignity; renewed use may require individualized assessment and follow-up beyond the group discussion.'},
 {names:['Tanya','Krishna'],stem:'Tanya and Krishna begin disagreeing about a recovery strategy. Their voices rise, and Tanya says, “Your approach makes no sense.”',question:'What would help the group work through the disagreement?',options:['Let the disagreement continue unchecked because conflict always promotes growth.','Pause the exchange, reinforce respectful communication, and guide members to explore different perspectives.','Select a winner so the group knows which recovery strategy to use.','Ask the group to avoid future differences of opinion.'],answer:1,why:'A facilitator can make disagreement constructive by protecting respectful dialogue and boundaries.'},
 {names:['Jamal','Tanya','Krishna'],stem:'Someone reports that a member discussed Jamal’s recovery story with people outside the group. The other members appear worried about privacy.',question:'What should happen next?',options:['Ignore the report until another member complains.','Promise everyone that no breach could happen again.','Take the concern seriously, alert the qualified facilitator, and follow the program’s confidentiality procedures.','Invite the group to vote on whether the situation matters.'],answer:2,why:'Privacy concerns deserve a prompt, policy-based response and truthful discussion of confidentiality limits.'},
 {names:['Jamal','Tanya','Krishna'],stem:'The group is closing. Jamal feels more comfortable, Tanya has practiced listening, and Krishna says peer support encouraged him to keep attending.',question:'How can the session end in a useful way?',options:['Invite members to reflect on what helped, reinforce progress, and review any next steps or continuing support.','Skip reflection because members can process the session on their own.','Ask everyone to promise they will never struggle again.','Focus only on who participated most often.'],answer:0,why:'A purposeful closing reinforces learning, supports continuity, and recognizes that progress can look different for each member.'}

async function download13PDF(){const prompts=reflectionPrompts.map(([title,question],i)=>['Personal Reflection '+(i+1),question,(state.reflections||[])[i]||'']);const pageW=1275,pageH=1650,margin=92,contentW=pageW-margin*2;const pages=[];let canvas,ctx,y;const makePage=()=>{canvas=document.createElement('canvas');canvas.width=pageW;canvas.height=pageH;ctx=canvas.getContext('2d');ctx.fillStyle='#faf6ef';ctx.fillRect(0,0,pageW,pageH);ctx.fillStyle='#243746';ctx.fillRect(0,0,pageW,166);ctx.fillStyle='#d7a74a';ctx.fillRect(0,166,pageW,10);ctx.fillStyle='#fff';ctx.font='700 38px Inter, Arial, sans-serif';ctx.fillText('Group Therapy, Part 2',margin,76);ctx.font='600 22px Inter, Arial, sans-serif';ctx.fillStyle='#dce9ee';ctx.fillText('Harbor Point · Module 13 Reflection Report',margin,128);y=232;ctx.font='500 19px Inter, Arial, sans-serif';ctx.fillStyle='#354f5c';ctx.fillText('Completed: '+new Date().toLocaleString(),margin,y);y+=58};const wrap=(value,font,maxWidth)=>{ctx.font=font;const words=String(value||'No response recorded.').split(/\s+/);const lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines};const add=async()=>{await new Promise(r=>canvas.toBlob(b=>{pages.push(b);r()},'image/jpeg',.9))};makePage();for(const [title,prompt,response] of prompts){const t=wrap(title,'800 25px Inter, Arial, sans-serif',contentW-48),p=wrap(prompt,'700 19px Inter, Arial, sans-serif',contentW-48),r=wrap(response,'500 21px Inter, Arial, sans-serif',contentW-48);const boxH=38+t.length*33+12+p.length*28+18+r.length*31+32;if(y+boxH>pageH-90){await add();makePage()}ctx.fillStyle='#fffdfa';m13RoundRect(ctx,margin,y,contentW,boxH,20,true,false);ctx.strokeStyle='#dfd5c7';ctx.lineWidth=3;m13RoundRect(ctx,margin,y,contentW,boxH,20,false,true);let yy=y+38;ctx.fillStyle='#243746';ctx.font='800 25px Inter, Arial, sans-serif';t.forEach(line=>{ctx.fillText(line,margin+24,yy);yy+=33});yy+=4;ctx.fillStyle='#496173';ctx.font='700 19px Inter, Arial, sans-serif';p.forEach(line=>{ctx.fillText(line,margin+24,yy);yy+=28});yy+=10;ctx.fillStyle='#263238';ctx.font='500 21px Inter, Arial, sans-serif';r.forEach(line=>{ctx.fillText(line,margin+24,yy);yy+=31});y+=boxH+24}await add();const imgs=[];for(const b of pages)imgs.push(new Uint8Array(await b.arrayBuffer()));const bytes=build13PDF(imgs,pageW,pageH);const blob=new Blob([bytes],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CDCA_Module13_Reflections.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);const status=document.getElementById('reflectionStatus');if(status)status.textContent='Your PDF was created. Save it and submit it to Blackboard.'}
function build13PDF(images,pageW,pageH){const enc=new TextEncoder(),chunks=[],offsets=[0];let length=0;const pt=t=>{const b=enc.encode(t);chunks.push(b);length+=b.length},pb=b=>{chunks.push(b);length+=b.length};pt('%PDF-1.4\n%PDFIMG\n');const objCount=2+images.length*3,pageRefs=[];const obj=(n,w)=>{offsets[n]=length;pt(`${n} 0 obj\n`);w();pt('\nendobj\n')};images.forEach((img,i)=>{const po=3+i*3,co=4+i*3,io=5+i*3;pageRefs.push(`${po} 0 R`);obj(po,()=>pt(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im${i+1} ${io} 0 R >> >> /Contents ${co} 0 R >>`));const content=`q\n612 0 0 792 0 0 cm\n/Im${i+1} Do\nQ\n`,cb=enc.encode(content);obj(co,()=>{pt(`<< /Length ${cb.length} >>\nstream\n`);pb(cb);pt('endstream')});obj(io,()=>{pt(`<< /Type /XObject /Subtype /Image /Width ${pageW} /Height ${pageH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);pb(img);pt('\nendstream')})});obj(1,()=>pt('<< /Type /Catalog /Pages 2 0 R >>'));obj(2,()=>pt(`<< /Type /Pages /Kids [${pageRefs.join(' ')}] /Count ${images.length} >>`));const xref=length;pt(`xref\n0 ${objCount+1}\n0000000000 65535 f \n`);for(let i=1;i<=objCount;i++)pt(String(offsets[i]||0).padStart(10,'0')+' 00000 n \n');pt(`trailer\n<< /Size ${objCount+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);const out=new Uint8Array(length);let pos=0;for(const b of chunks){out.set(b,pos);pos+=b.length}return out}
